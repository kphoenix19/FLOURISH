services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flourish}
      POSTGRES_USER: ${POSTGRES_USER:-flourish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flourish_dev}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - flourish-postgres-data:/var/lib/postgresql/data

volumes:
  flourish-postgres-data:
