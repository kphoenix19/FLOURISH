name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Disposable service database only; never use application database secrets.
      TEST_DATABASE_URL: postgresql://flourish_test:ci_disposable_only@127.0.0.1:5432/flourish_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_disposable_only
          POSTGRES_DB: flourish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flourish_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec tsx scripts/setup-test-database.ts
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:ci_admin_disposable_only@127.0.0.1:5432/flourish_test
      - run: pnpm test:integration
      - run: pnpm build
